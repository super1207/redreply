[package]
name = "plugin-redlang"
version = "0.1.0"
edition = "2021"
description = "红色问答脚本引擎插件：解释器、命令库、脚本管理与触发链路"
license = "AGPL-3.0"

[dependencies]
redlang = { path = "../.." }
redreply-bot = { path = "../redreply-bot" }
fancy-regex = { workspace = true }
encoding = "0.2.33"
getrandom = "0.3.3"
base64 = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
brotli = "8.0.2"
chrono = { workspace = true }
md-5 = "0.10.6"
rcnb-rs = "0.1.0"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
imageproc = { version = "0.25.0", default-features = false, features = ["rayon"] }
gif = "0.13.1"
cron = "0.15.0"
hyper = { workspace = true }
hyper-tungstenite = { workspace = true }
tokio-tungstenite = { workspace = true }
tungstenite = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true }
scopeguard = { workspace = true }
log = "0.4.28"
tracing = "0.1.41"
opener = "0.8.3"
rusqlite = { version = "0.37.0", features = ["bundled", "functions"] }
sevenz-rust2 = { git = "https://github.com/super1207/sevenz-rust2" }
jsonpath-rust = "1.0.4"
rusttype = "0.9.3"
reqwest = { workspace = true }
time = { version = "0.3.44", features = ["formatting", "macros"] }
webp = "0.3.1"
sysinfo = "0.37.0"
usvg = "0.45.1"
resvg = { version = "0.45.1", default-features = false, features = ["text", "raster-images"] }
fontdb = { version = "0.23.0", default-features = false, features = ["fs"] }
flate2 = { workspace = true }
zhconv = { version = "0.3.3", features = ["opencc", "compress"] }
async-trait = { workspace = true }
html5gum = { workspace = true }
html-escape = { workspace = true }
tokio-util = { version = "0.7.16", default-features = false, features = ["io", "rt"] }
http-body-util = "0.1.3"
hyper-util = { version = "0.1.17", features = ["full"] }
bytes = "1.10.1"
crc64 = "2.0.0"
path-clean = "1.0.1"
rust-ini = "0.21.3"
mlua = { version = "0.11.3", features = ["lua54", "vendored"] }
ab_glyph = "0.2.31"
claxon = "0.4.3"
minimp3_fixed = "0.5.4"
silk-rs-no-llvm = { git = "https://github.com/super1207/silk-rs-no-llvm" }
lewton = "0.10.2"
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4"] }
scraper = "0.24.0"
markdown = "1.0.0-alpha.21"
regex = { workspace = true }
mail-parser = { workspace = true }
lettre = { workspace = true }
imap = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
xcap = "0.7.1"
winapi = { version = "0.3.9", features = ["winuser"] }
