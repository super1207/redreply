[package]
name = "msedge-tts"
version = "0.4.0"
edition = "2024"
description = "This library is a wrapper of MSEdge Read aloud function API. You can use it to synthesize text to speech with many voices MS provided."
license = "MIT OR Apache-2.0"
repository = "https://github.com/hs-CN/msedge-tts"
keywords = ["tts", "text-to-speech", "msedge-tts", "edge-tts"]
categories = ["multimedia::audio"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["blocking"]
proxy = [
    "ureq?/socks-proxy",
    "http",
    "httparse",
]
blocking = [
    "ureq",
]

[dependencies]
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.0"
thiserror = "2.0.18"
tungstenite = { workspace = true }
uuid = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
base64 = { workspace = true }

[dependencies.ureq]
version = "3.3.0"
optional = true
default-features = false
features = ["gzip", "json", "rustls"]

[dependencies.http]
version = "1.4.0"
optional = true

[dependencies.httparse]
version = "1.10.1"
optional = true
