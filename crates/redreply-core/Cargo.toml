[package]
name = "redreply-core"
version = "0.1.0"
edition = "2021"
description = "红色问答宿主核心：配置、资源、生命周期、运行时上下文与平台 API 桥接"
license = "AGPL-3.0"

[dependencies]
redreply-adapter = { path = "../redreply-adapter" }
redreply-bot = { path = "../redreply-bot" }
redreply-common = { path = "../redreply-common" }
bytes = "1.10.1"
chrono = { workspace = true }
log = "0.4.28"
sysinfo = "0.37.0"
futures-util = { workspace = true }
http-body-util = "0.1.3"
hyper = { workspace = true }
hyper-tungstenite = { workspace = true }
opener = "0.8.3"
rusqlite = { version = "0.37.0", features = ["bundled", "functions"] }
rust-embed = { version = "8.7.2", features = ["compression"] }
scopeguard = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
