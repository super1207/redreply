<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看板娘 AI 开发者</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --panel: #ffffff;
            --text: #2a2f2e;
            --muted: #66706d;
            --border: #d8dfdc;
            --accent: #267567;
            --user: #285f91;
            --assistant: #9b352c;
            --tool: #7a5fa8;
            --system: #8a6d3b;
            --danger: #b23b32;
        }
        [data-theme="dark"] {
            --bg: #1c1f1e;
            --panel: #262a29;
            --text: #e4e8e7;
            --muted: #9aa5a2;
            --border: #3a403e;
            --accent: #4ec9b4;
            --user: #6fa8dc;
            --assistant: #e08a80;
            --tool: #b79de0;
            --system: #d4b26a;
            --danger: #ef8b82;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            background: var(--bg);
            color: var(--text);
            font-family: "Microsoft YaHei", system-ui, sans-serif;
            font-size: 14px;
        }
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        h1 {
            margin: 0;
            font-size: 20px;
        }
        .stats {
            color: var(--muted);
            font-size: 13px;
        }
        button {
            padding: 6px 14px;
            cursor: pointer;
            font: inherit;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: var(--panel);
            color: var(--text);
        }
        button:hover { border-color: var(--accent); color: var(--accent); }
        button:disabled { cursor: not-allowed; opacity: 0.55; }
        section {
            margin-bottom: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        section > h2 {
            margin: 0;
            padding: 10px 14px;
            font-size: 15px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .scroll-area {
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px 14px;
        }
        .msg {
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 8px;
            background: color-mix(in srgb, var(--bg) 40%, transparent);
        }
        .msg-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            flex-wrap: wrap;
        }
        .msg-actions {
            display: flex;
            gap: 6px;
            margin-left: auto;
        }
        .msg-action {
            padding: 2px 8px;
            font-size: 12px;
        }
        .msg-action.delete:hover {
            border-color: var(--danger);
            color: var(--danger);
        }
        .badge {
            font-size: 12px;
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 10px;
            color: #fff;
        }
        .badge.user { background: var(--user); }
        .badge.assistant { background: var(--assistant); }
        .badge.tool { background: var(--tool); }
        .badge.system { background: var(--system); }
        .time {
            font-size: 12px;
            color: var(--muted);
        }
        .msg-content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.5;
        }
        .msg-content.empty {
            color: var(--muted);
            font-style: italic;
        }
        .msg-editor textarea {
            display: block;
            width: 100%;
            min-height: 220px;
            resize: vertical;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: var(--bg);
            color: var(--text);
            font: 12px/1.5 Consolas, monospace;
        }
        .msg-editor textarea:focus {
            outline: 2px solid color-mix(in srgb, var(--accent) 35%, transparent);
            border-color: var(--accent);
        }
        .editor-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 8px;
        }
        details {
            margin-top: 6px;
            font-size: 13px;
        }
        details summary {
            cursor: pointer;
            color: var(--accent);
        }
        details pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            margin: 6px 0 0;
            padding: 8px;
            border-radius: 5px;
            background: var(--bg);
            font-size: 12px;
        }
        .diary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
        }
        .diary {
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            background: color-mix(in srgb, var(--bg) 40%, transparent);
        }
        .diary-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .diary-meta {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .diary-content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            line-height: 1.5;
            font-size: 13px;
        }
        .empty {
            color: var(--muted);
            padding: 12px;
            text-align: center;
        }
        .error-banner {
            padding: 8px 14px;
            color: var(--assistant);
            border-bottom: 1px solid var(--border);
        }
    </style>
</head>

<body>
    <header>
        <h1>看板娘 AI 开发者</h1>
        <span class="stats" id="conv-stats"></span>
        <span class="stats" id="diary-stats"></span>
        <button id="refresh-btn" type="button">刷新</button>
        <button id="theme-btn" type="button">切换夜间模式</button>
    </header>

    <section id="conv-section">
        <h2>对话历史 <span class="stats" id="conv-count"></span></h2>
        <div id="conv-error" class="error-banner" hidden></div>
        <div id="conv-list" class="scroll-area"></div>
    </section>

    <section id="diary-section">
        <h2>日记本 <span class="stats" id="diary-count"></span></h2>
        <div id="diary-error" class="error-banner" hidden></div>
        <div id="diary-list" class="scroll-area"></div>
    </section>

    <section id="payload-section">
        <h2>下次将发送给 AI 的完整请求 JSON <span class="stats" id="payload-count"></span></h2>
        <div id="payload-error" class="error-banner" hidden></div>
        <div class="scroll-area">
            <pre id="payload-json" style="white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font-size: 12px; line-height: 1.5;"></pre>
        </div>
    </section>

    <script>
        (function () {
            "use strict";

            function fmtTime(timestamp) {
                if (!Number.isFinite(timestamp)) return "时间未知";
                const date = new Date(timestamp * 1000);
                if (Number.isNaN(date.getTime())) return "时间未知";
                return date.toLocaleString("zh-CN", { hour12: false });
            }

            function esc(text) {
                return String(text).replace(/[&<>"']/g, function (ch) {
                    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
                });
            }

            const roleNames = {
                user: "用户",
                assistant: "看板娘",
                tool: "工具",
                system: "系统"
            };
            let conversationData = null;
            let editingIndex = null;
            let mutationPending = false;

            function messageHtml(message, index) {
                const role = String(message.role || "?").toLowerCase();
                const content = String(message.content || "");
                const timestamp = Number(message.timestamp);
                const actions = editingIndex === index ? "" : '<span class="msg-actions">' +
                    '<button class="msg-action" type="button" data-action="edit" data-index="' + index + '">编辑</button>' +
                    '<button class="msg-action delete" type="button" data-action="delete" data-index="' + index + '">删除</button>' +
                    "</span>";
                const head =
                    '<span class="badge ' + esc(role) + '">' + esc(roleNames[role] || role) + "</span>" +
                    '<span class="time">' + esc(fmtTime(timestamp)) + "</span>" +
                    (message.tool_call_id ? '<span class="time">调用 ' + esc(message.tool_call_id) + "</span>" : "") +
                    actions;
                if (editingIndex === index) {
                    return '<div class="msg" data-message-index="' + index + '">' +
                        '<div class="msg-head">' + head + "</div>" +
                        '<div class="msg-editor">' +
                        '<textarea data-editor-index="' + index + '">' + esc(JSON.stringify(message, null, 2)) + "</textarea>" +
                        '<div class="editor-actions">' +
                        '<button type="button" data-action="cancel" data-index="' + index + '">取消</button>' +
                        '<button type="button" data-action="save" data-index="' + index + '">保存</button>' +
                        "</div></div></div>";
                }
                let extra = "";
                if (message.reasoning_content) {
                    extra += '<details><summary>思考内容 (' + esc(String(message.reasoning_content).length) + " 字符)</summary><pre>" +
                        esc(message.reasoning_content) + "</pre></details>";
                }
                if (message.tool_calls && Array.isArray(message.tool_calls) && message.tool_calls.length) {
                    const calls = message.tool_calls.map(function (call) {
                        return call.id + " " + (call.function && call.function.name || "");
                    }).join("\n");
                    extra += '<details><summary>工具调用 (' + message.tool_calls.length + " 个)</summary><pre>" +
                        esc(calls) + "</pre></details>";
                }
                return '<div class="msg">' +
                    '<div class="msg-head">' + head + "</div>" +
                    '<div class="msg-content' + (content ? "" : " empty") + '">' + esc(content) + "</div>" +
                    extra +
                    "</div>";
            }

            function renderConversation(data) {
                const list = document.getElementById("conv-list");
                const errorBox = document.getElementById("conv-error");
                const countEl = document.getElementById("conv-count");
                const statsEl = document.getElementById("conv-stats");
                conversationData = data;
                if (!data) {
                    list.innerHTML = '<div class="empty">无对话记录</div>';
                    countEl.textContent = "";
                    statsEl.textContent = "";
                    renderPayload(null);
                    return;
                }
                const messages = Array.isArray(data.messages) ? data.messages : [];
                if (!messages.length) {
                    list.innerHTML = '<div class="empty">无对话记录</div>';
                } else {
                    list.innerHTML = messages.map(messageHtml).join("");
                    if (editingIndex === null) {
                        list.scrollTop = list.scrollHeight;
                    } else {
                        const editor = list.querySelector('[data-editor-index="' + editingIndex + '"]');
                        if (editor) {
                            editor.focus();
                            editor.setSelectionRange(0, 0);
                            editor.scrollIntoView({ block: "nearest" });
                        }
                    }
                }
                countEl.textContent = "共 " + messages.length + " 条";
                statsEl.textContent = "对话 " + messages.length + " 条";
                errorBox.hidden = true;
                renderPayload(data.next_payload);
            }

            function showConversationError(message) {
                const box = document.getElementById("conv-error");
                box.textContent = message;
                box.hidden = false;
            }

            async function mutateConversation(body) {
                if (mutationPending) return;
                mutationPending = true;
                document.querySelectorAll("#conv-list button").forEach(function (button) {
                    button.disabled = true;
                });
                try {
                    const response = await fetch("/live2d_conversation", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body)
                    });
                    const payload = await response.json();
                    if (!response.ok || payload.retcode !== 0) {
                        throw new Error((payload.data && payload.data.message) || "修改失败");
                    }
                    editingIndex = null;
                    await refresh();
                } catch (error) {
                    showConversationError("修改对话失败: " + error.message);
                } finally {
                    mutationPending = false;
                    document.querySelectorAll("#conv-list button").forEach(function (button) {
                        button.disabled = false;
                    });
                }
            }

            document.getElementById("conv-list").addEventListener("click", function (event) {
                const button = event.target.closest("button[data-action]");
                if (!button || mutationPending) return;
                const index = Number(button.dataset.index);
                if (!Number.isInteger(index) || !conversationData || !Array.isArray(conversationData.messages)) return;
                const action = button.dataset.action;
                if (action === "edit") {
                    editingIndex = index;
                    renderConversation(conversationData);
                    return;
                }
                if (action === "cancel") {
                    editingIndex = null;
                    renderConversation(conversationData);
                    return;
                }
                if (action === "delete") {
                    if (window.confirm("确定删除这条对话记录？")) {
                        mutateConversation({
                            action: "delete",
                            index: index,
                            expected: conversationData.messages[index]
                        });
                    }
                    return;
                }
                if (action === "save") {
                    const editor = document.querySelector('[data-editor-index="' + index + '"]');
                    try {
                        const message = JSON.parse(editor.value);
                        if (!message || Array.isArray(message) || typeof message !== "object") {
                            throw new Error("消息必须是 JSON 对象");
                        }
                        mutateConversation({
                            action: "update",
                            index: index,
                            expected: conversationData.messages[index],
                            message: message
                        });
                    } catch (error) {
                        showConversationError("JSON 格式错误: " + error.message);
                        editor.focus();
                    }
                }
            });

            function renderPayload(nextPayload) {
                const pre = document.getElementById("payload-json");
                const countEl = document.getElementById("payload-count");
                const errorBox = document.getElementById("payload-error");
                if (!nextPayload || typeof nextPayload !== "object") {
                    pre.textContent = "{}";
                    countEl.textContent = "0 条消息";
                    errorBox.hidden = true;
                    return;
                }
                const messages = Array.isArray(nextPayload.messages) ? nextPayload.messages : [];
                pre.textContent = JSON.stringify(nextPayload, null, 2);
                countEl.textContent = messages.length + " 条消息";
                errorBox.hidden = true;
            }

            function renderDiary(data) {
                const list = document.getElementById("diary-list");
                const errorBox = document.getElementById("diary-error");
                const countEl = document.getElementById("diary-count");
                const statsEl = document.getElementById("diary-stats");
                if (!data) {
                    list.innerHTML = '<div class="empty">日记本为空</div>';
                    countEl.textContent = "";
                    statsEl.textContent = "";
                    return;
                }
                const items = Array.isArray(data.items) ? data.items : [];
                if (!items.length) {
                    list.innerHTML = '<div class="empty">日记本为空</div>';
                } else {
                    list.innerHTML = '<div class="diary-grid">' + items.map(function (item) {
                        return '<div class="diary">' +
                            '<div class="diary-title">' + esc(item.title) + "</div>" +
                            '<div class="diary-meta">' + esc(item.create_time || "时间未知") +
                            " · " + esc(item.key) + "</div>" +
                            '<div class="diary-content">' + esc(item.content) + "</div>" +
                            "</div>";
                    }).join("") + "</div>";
                }
                const total = Number(data.total) || 100;
                countEl.textContent = items.length + " / " + total + " 条";
                statsEl.textContent = "日记 " + items.length + " / " + total + " 条";
                errorBox.hidden = true;
            }

            async function refresh() {
                try {
                    const convResponse = await fetch("/live2d_conversation");
                    const convPayload = await convResponse.json();
                    if (convPayload.retcode === 0) {
                        renderConversation(convPayload.data);
                        document.getElementById("conv-error").hidden = true;
                    } else {
                        const error = document.getElementById("conv-error");
                        error.textContent = "读取对话失败: " + ((convPayload.data && convPayload.data.message) || "未知错误");
                        error.hidden = false;
                    }
                } catch (error) {
                    const box = document.getElementById("conv-error");
                    box.textContent = "读取对话失败: " + error;
                    box.hidden = false;
                }
                try {
                    const diaryResponse = await fetch("/live2d_diary");
                    const diaryPayload = await diaryResponse.json();
                    if (diaryPayload.retcode === 0) {
                        renderDiary(diaryPayload.data);
                        document.getElementById("diary-error").hidden = true;
                    } else {
                        const error = document.getElementById("diary-error");
                        error.textContent = "读取日记失败: " + ((diaryPayload.data && diaryPayload.data.message) || "未知错误");
                        error.hidden = false;
                    }
                } catch (error) {
                    const box = document.getElementById("diary-error");
                    box.textContent = "读取日记失败: " + error;
                    box.hidden = false;
                }
            }

            document.getElementById("refresh-btn").addEventListener("click", function () {
                if (editingIndex !== null && !window.confirm("放弃正在编辑的内容并刷新？")) return;
                editingIndex = null;
                refresh();
            });
            document.getElementById("theme-btn").addEventListener("click", function () {
                if (document.documentElement.dataset.theme === "dark") {
                    delete document.documentElement.dataset.theme;
                } else {
                    document.documentElement.dataset.theme = "dark";
                }
            });

            refresh();
            setInterval(function () {
                if (editingIndex === null && !mutationPending) refresh();
            }, 15000);
        }());
    </script>
</body>

</html>
