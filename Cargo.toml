[package]
name = "redlang"
version = "1.0.86"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    ".",
    "crates/redreply-adapter",
    "crates/redreply-browser",
    "crates/msedge-tts",
]
default-members = [
    ".",
    "crates/redreply-browser",
]

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = "0.4.42"
fancy-regex = "0.16.2"
flate2 = { version = "1.1.1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3.31"
html5gum = "0.8.0"
html-escape = "0.2.13"
hyper = { version = "1.7.0", features = ["full"] }
hyper-tungstenite = "0.20.0"
imap = { git = "https://github.com/jonhoo/rust-imap", default-features = false }
lazy_static = "1.5.0"
lettre = { version = "0.11.18", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
mail-parser = "0.11.1"
regex = "1.11.2"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
webpki-roots = "1.0"
scopeguard = "1.2.0"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.29.0"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "fast-rng"] }

[dependencies]
redreply-adapter = { path = "crates/redreply-adapter" }
fancy-regex = { workspace = true }
encoding = "0.2.33"
getrandom = "0.3.3"
base64 = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
brotli = "8.0.2"
lazy_static = { workspace = true }
chrono = { workspace = true }
md-5 = "0.10.6"
rcnb-rs = "0.1.0"
rust-embed = {version="8.7.2",features = ["compression"]}
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
imageproc = { version = "0.25.0", default-features = false, features = ["rayon"] }
gif = "0.13.1"
cron = "0.15.0"
hyper = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true }
hyper-tungstenite = { workspace = true }
tokio-tungstenite = { workspace = true }
scopeguard = { workspace = true }
log = "0.4.28"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter","time","local-time"]}
opener = "0.8.3"
rusqlite = {version = "0.37.0",features = ["bundled","functions"]}
sevenz-rust2 = {"git" = "https://github.com/super1207/sevenz-rust2"}
jsonpath-rust = "1.0.4"
rusttype = "0.9.3"
# markdown = "1.0.0-alpha.7"
reqwest = { workspace = true }
time = { version = "0.3.44", features = ["formatting", "macros"] }
# headless_chrome = {version="1.0.5",default-features = false}
webp = "0.3.1"
sysinfo = "0.37.0"
usvg = "0.45.1"
resvg = { version = "0.45.1", default-features = false, features = [ "text", "raster-images"  ] }
fontdb = { version = "0.23.0", default-features = false, features = [ "fs" ] }
flate2 = { workspace = true }
zhconv = {version  = "0.3.3", features = ["opencc","compress"]}
async-trait = { workspace = true }
html5gum = { workspace = true }
html-escape = { workspace = true }
tokio-util = { version = "0.7.16", default-features = false, features = [ "io" ] }
http-body-util = "0.1.3"
hyper-util = { version = "0.1.17", features = ["full"] }
bytes = "1.10.1"
crc64 = "2.0.0"
path-clean = "1.0.1"
rust-ini = "0.21.3"
mlua = { version = "0.11.3", features = ["lua54", "vendored"] }
ab_glyph = "0.2.31"

claxon = "0.4.3"
minimp3_fixed ="0.5.4"
silk-rs-no-llvm = {git = "https://github.com/super1207/silk-rs-no-llvm"}
lewton = "0.10.2"

msedge-tts = { path = "crates/msedge-tts", features = ["proxy"] }

imap = { workspace = true }
mail-parser = { workspace = true }
lettre = { workspace = true }

scraper = "0.24.0"
tungstenite = { workspace = true }
markdown = "1.0.0-alpha.21"
rumqttc = {git = "https://github.com/super1207/rumqtt",default-features = false}
regex = { workspace = true }

tokio-postgres = { version = "0.7.15", features = ["with-serde_json-1"] }

[build-dependencies]
embed-resource = "3.0.6"


[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
xcap = "0.7.1"
tray-icon = "0.21.2"
tao = "0.34.5"
wry = "0.53.5"
winapi = { version = "0.3.9", features = ["winuser"] }
dirs = "5.0"
rfd = "0.15"
libloading = "0.8.9"

[target.'cfg(not(windows))'.dependencies]
redreply-browser = { path = "crates/redreply-browser" }


[profile.dev]
debug = 0
codegen-units = 16
incremental = true

[profile.dev.package."*"]
debug = 0
 
[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
strip = true # Remove debug symbols
