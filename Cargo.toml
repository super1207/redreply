[package]
name = "redlang"
version = "1.0.86"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
members = [
    ".",
    "crates/redreply",
    "crates/redreply-adapter",
    "crates/redreply-bot",
    "crates/redreply-core",
    "crates/redreply-browser",
    "crates/redreply-common",
    "crates/plugin-redlang",
    "crates/plugin-tts",
    "crates/plugin-browser",
    "crates/plugin-mqtt",
    "crates/plugin-pgsql",
    "crates/plugin-onebot",
    "crates/plugin-tianwang",
    "crates/msedge-tts",
]
default-members = [
    ".",
    "crates/redreply",
    "crates/redreply-bot",
    "crates/redreply-core",
    "crates/redreply-browser",
]

[workspace.dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
chrono = "0.4.42"
fancy-regex = "0.16.2"
flate2 = { version = "1.1.1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3.31"
html5gum = "0.8.0"
html-escape = "0.2.13"
hyper = { version = "1.7.0", features = ["full"] }
hyper-tungstenite = "0.20.0"
imap = { git = "https://github.com/jonhoo/rust-imap", default-features = false }
lettre = { version = "0.11.18", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
mail-parser = "0.11.1"
regex = "1.11.2"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "multipart", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
webpki-roots = "1.0"
scopeguard = "1.2.0"
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.29.0"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4", "fast-rng"] }

[dependencies]
redreply-core = { path = "crates/redreply-core" }

[profile.dev]
debug = 0
codegen-units = 16
incremental = true

[profile.dev.package."*"]
debug = 0

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
strip = true # Remove debug symbols
